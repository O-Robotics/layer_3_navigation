bt_navigator:
  ros__parameters:
    # -- Frames and timing -----------------------------------------------------
    use_sim_time:                    false                               # Use simulated clock if /clock is being published. Nav2 default is typically false on real robots.
    global_frame:                    map                                 # Top-level navigation frame used by the behavior tree. A live SLAM map now anchors global planning.
    robot_base_frame:                base_footprint                      # Robot body frame Nav2 plans and controls against. Common default is base_link.
    odom_topic:                      localization/odometry_fused         # Odometry topic consumed by the navigator for robot motion estimates. Under the default namespace this resolves to /amr_sweeper/localization/odometry_fused.
    bt_loop_duration:                200                                 # Behavior tree tick period in milliseconds. Common Nav2 default is 10 ms; this config runs a slower 5 Hz tree tick.
    default_server_timeout:          30                                  # Seconds to wait for BT action/service servers before timing out. Default in many examples is 20 s.
    wait_for_service_timeout:        2000                                # Milliseconds to wait when connecting to required ROS services. Common default is 1000 ms.
    # -- Result channels -------------------------------------------------------
    error_code_names:                ["compute_path_error_code", "follow_path_error_code"]  # Jazzy bt_navigator expects these planner/controller result channels to be named explicitly.

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.

controller_server:
  ros__parameters:
    # -- Controller runtime ----------------------------------------------------
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    controller_frequency:            10.0                                # Controller update rate in Hz. Common Nav2 default is 20 Hz.
    min_x_velocity_threshold:        0.001                               # Linear X deadband below which motion is treated as zero. Default is commonly 0.001 m/s.
    min_y_velocity_threshold:        0.001                               # Linear Y deadband below which motion is treated as zero. Default is commonly 0.5 for holonomic robots; near-zero fits diff drive.
    min_theta_velocity_threshold:    0.001                               # Angular deadband below which rotation is treated as zero. Default is commonly 0.001 rad/s.
    failure_tolerance:               0.6                                 # Extra seconds of controller failure tolerance before aborting. Was 0.3; Nav2 examples often use 0.3.
    progress_checker_plugins:        ["progress_checker"]                # Progress checker plugins available to the controller. Jazzy expects this plural key.
    goal_checker_plugins:            ["general_goal_checker"]            # Goal checker plugins available to the controller. Common examples load one SimpleGoalChecker.
    controller_plugins:              ["FollowPath"]                      # Controller plugins available to execute paths. Common examples load one DWB FollowPath plugin.

    # -- Progress checking -----------------------------------------------------
    progress_checker:
      plugin:                        "nav2_controller::SimpleProgressChecker"  # Progress checker implementation. Common default/example plugin is SimpleProgressChecker.
      required_movement_radius:      0.05                                # Robot must move at least this far in meters to count as progress. Common examples use 0.5 m.
      movement_time_allowance:       60.0                                # Seconds allowed without required motion before declaring no progress. Common examples use 10.0 s.

    # -- Goal checking ---------------------------------------------------------
    general_goal_checker:
      stateful:                      true                                # Goal checker remembers once the robot has entered tolerance. Nav2 example default is typically true.
      plugin:                        "nav2_controller::SimpleGoalChecker"  # Goal checker implementation. Common default/example plugin is SimpleGoalChecker.
      xy_goal_tolerance:             0.5                                 # Position tolerance in meters at the goal. Common examples also use 0.25 to 0.5 m.
      yaw_goal_tolerance:            0.35                                # Heading tolerance in radians at the goal. Was 0.785 rad; tighter heading helps chunk-to-chunk alignment.

    # -- Local planner ---------------------------------------------------------
    FollowPath:
      plugin:                        "dwb_core::DWBLocalPlanner"         # Local planner implementation used to follow the path. Common Nav2 example plugin is DWBLocalPlanner.
      debug_trajectory_details:      false                               # Publish extra trajectory scoring debug info. Default is typically false.

      min_vel_x:                     0.0                                 # Minimum forward linear velocity in m/s. Common examples use 0.0.
      min_vel_y:                     0.0                                 # Minimum lateral linear velocity in m/s. Diff-drive default stays 0.0.
      max_vel_x:                     0.26                                # Maximum forward linear velocity in m/s. Common examples are often around 0.26 m/s.
      max_vel_y:                     0.0                                 # Maximum lateral linear velocity in m/s. Diff-drive robots keep this at 0.0.
      max_vel_theta:                 0.35                                # Maximum angular speed in rad/s. Was 0.15; common examples are closer to 1.0 rad/s.
                                       
      min_speed_xy:                  0.0                                 # Minimum translational speed magnitude in m/s. Common default/example is 0.0.
      max_speed_xy:                  0.26                                # Maximum translational speed magnitude in m/s. Usually matched to max_vel_x for diff-drive robots.
      min_speed_theta:               0.0                                 # Minimum angular speed magnitude in rad/s. Common examples use 0.0.
                                       
      acc_lim_x:                     1.0                                 # Forward acceleration limit in m/s^2. Was 2.5; common examples often use 2.5.
      acc_lim_y:                     0.0                                 # Lateral acceleration limit in m/s^2. Diff-drive robots keep this at 0.0.
      acc_lim_theta:                 0.8                                 # Angular acceleration limit in rad/s^2. Common examples are often around 3.2.
                                       
      decel_lim_x:                   -1.0                                # Forward deceleration limit in m/s^2. Was -2.5; common examples often use -2.5.
      decel_lim_y:                   0.0                                 # Lateral deceleration limit in m/s^2. Diff-drive robots keep this at 0.0.
      decel_lim_theta:               -0.8                                # Angular deceleration limit in rad/s^2. Common examples are often around -3.2.
                                       
      vx_samples:                    5                                   # Number of forward velocity samples considered per control cycle. Common examples use 20.
      vy_samples:                    1                                   # Number of lateral velocity samples. Diff-drive robots use 1 because y velocity is fixed at zero.
      vtheta_samples:                10                                  # Number of angular velocity samples considered per cycle. Common examples use 20.
                                       
      sim_time:                      0.8                                 # Seconds to forward-simulate each candidate trajectory. Common examples use 1.7 s.
      linear_granularity:            0.05                                # Distance step in meters when discretizing trajectories. Common examples use 0.05 m.
      angular_granularity:           0.025                               # Angular step in radians when discretizing trajectories. Common examples use 0.025 rad.
      transform_tolerance:           0.2                                 # TF lookup tolerance in seconds for controller transforms. Tightened for programmed missions so the controller rejects stale TF instead of chasing old poses.

      xy_goal_tolerance:                   0.25                          # Position tolerance in meters used internally by DWB near the goal. Common examples use 0.25 m.
      trans_stopped_velocity:              0.05                          # Translational speed below which the robot is considered stopped. Common examples use 0.25 m/s.
      short_circuit_trajectory_evaluation: true                          # Stop scoring once a clearly best trajectory is found. Common examples usually enable this.
      stateful:                            true                          # Preserve planner state across cycles for smoother behavior. Common example configs often set true.

      critics:                       ["Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]  # Trajectory scoring critics loaded by DWB. This is a trimmed set versus larger example critic lists.
   
      PathAlign.scale:                     4.0                           # Weight for staying aligned with the path heading. Common examples often use 32.0.
      PathAlign.forward_point_distance:    0.1                           # Forward projection distance in meters for path alignment scoring. Common examples use 0.1 m.
      GoalAlign.scale:                     2.0                           # Weight for aligning robot heading with the goal heading. Common examples often use 24.0.
      GoalAlign.forward_point_distance:    0.1                           # Forward projection distance in meters for goal alignment scoring. Common examples use 0.1 m.
      PathDist.scale:                      16.0                          # Weight for staying close to the global path. Common examples often use 32.0.
      GoalDist.scale:                      20.0                          # Weight for reducing distance to the goal. Was 12.0; common examples often use 24.0.

local_costmap:
  local_costmap:
    ros__parameters:
      # -- Local costmap core --------------------------------------------------
      update_frequency:              5.0                                 # Costmap update rate in Hz. Common Nav2 example default is 5 Hz.
      publish_frequency:             2.0                                 # Costmap publish rate in Hz for downstream consumers and visualization. Common examples use 2 Hz.
      global_frame:                  odom                                # Keep the controller's rolling costmap in the continuous local frame owned by FusionCore.
      robot_base_frame:              base_footprint                      # Robot body frame used to place the footprint in the costmap. Common default is base_link.
      use_sim_time:                  false                               # Use simulated clock if /clock is present. Default is typically false.
      rolling_window:                true                                # Keep the local costmap centered on the robot instead of storing a fixed map. Common local costmap default is true.
      width:                         10                                  # Width of the local rolling costmap in meters. Many examples use 3 m.
      height:                        10                                  # Height of the local rolling costmap in meters. Many examples use 3 m.
      resolution:                    0.05                                # Costmap cell size in meters. Common local costmap example value is 0.05 m.
      footprint:                     "[[0.55, 0.30], [0.55, -0.30], [-0.28, -0.30], [-0.28, 0.30]]"  # Robot footprint polygon in meters in base_footprint. Replaces robot_radius=0.22 to include the front tool width.
      plugins:                       ["static_layer", "inflation_layer"]  # Local planning now consumes the mapping-owned rolling odom-frame local costmap plus inflation.

      # -- Mapping-fed local layer --------------------------------------------
      static_layer:
        plugin:                      "nav2_costmap_2d::StaticLayer"      # Consume the mapping-owned rolling occupancy grid instead of subscribing to raw sensors directly.
        map_topic:                   mapping/local_costmap               # Rolling odom-frame local costmap published by amr_sweeper_mapping.
        map_subscribe_transient_local: true                               # Match the mapping publisher's transient-local durability so Nav2 gets the latest latched map immediately at startup.
        subscribe_to_updates:        false                                # The mapping node republishes full local OccupancyGrid messages rather than incremental updates.

      # -- Inflation layer -----------------------------------------------------
      inflation_layer:
        plugin:                      "nav2_costmap_2d::InflationLayer"   # Inflation layer implementation. This is Nav2's standard inflation plugin.
        cost_scaling_factor:         3.0                                 # How quickly inflated costs decay away from obstacles. Common examples use 3.0.
        inflation_radius:            0.55                                # Distance in meters to inflate around obstacles. Common examples often use 0.55 m.
                                  
      always_send_full_costmap:      false                               # Publish incremental updates instead of the full map every cycle. Common default/example is false.

global_costmap:
  global_costmap:
    ros__parameters:
      # -- Global costmap core -------------------------------------------------
      update_frequency:              1.0                                 # Global costmap update rate in Hz. Common example default is 1 Hz.
      publish_frequency:             1.0                                 # Global costmap publish rate in Hz. Common example default is 1 Hz.
      global_frame:                  map                                 # Georeferenced global frame used for mission polygons and long-horizon planning.
      rolling_window:                false                               # Keep a fixed georeferenced planning surface instead of a robot-centered rolling window.
      robot_base_frame:              base_footprint                      # Robot body frame used to place the footprint in the costmap. Common default is base_link.
      use_sim_time:                  false                               # Use simulated clock if /clock is present. Default is typically false.
      footprint:                     "[[0.55, 0.30], [0.55, -0.30], [-0.28, -0.30], [-0.28, 0.30]]"  # Same swept footprint as local_costmap. Replaces robot_radius=0.22 for better global planning around the tool.
      resolution:                    0.05                                # Match the live SLAM occupancy map resolution so global planning layers stay aligned.
      track_unknown_space:           true                                # Preserve unknown space from SLAM so the planner can reason over explored versus unexplored areas.
      plugins:                       ["static_layer", "inflation_layer"]  # Use the mapping publisher as the single source of global mission-map truth and inflate it for global planning.

      # -- Mapping-owned global layer -----------------------------------------
      static_layer:
        plugin:                      "nav2_costmap_2d::StaticLayer"      # Consume the continuously updated global costmap published by amr_sweeper_mapping.
        map_topic:                   mapping/global_costmap               # The mapping coordinator republishes the runtime global costmap on a dedicated topic for Nav2 consumption.
        map_subscribe_transient_local: true                               # Match the mapping publisher's transient-local durability so Nav2 gets the latest latched map immediately at startup.
        subscribe_to_updates:        false                                # The padded live map is republished as full OccupancyGrid messages, so a separate update stream is unnecessary.

      # -- Inflation layer -----------------------------------------------------
      inflation_layer:
        plugin:                      "nav2_costmap_2d::InflationLayer"   # Inflation layer implementation. This is Nav2's standard inflation plugin.
        cost_scaling_factor:         3.0                                 # How quickly inflated costs decay away from obstacles. Common examples use 3.0.
        inflation_radius:            0.55                                # Distance in meters to inflate around obstacles. Common examples often use 0.55 m.

      always_send_full_costmap:      false                               # Publish incremental updates instead of the full map every cycle. Common default/example is false.

map_server:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    yaml_filename:                   ""                                  # Static map files are not used in the live programmed-mission stack.

map_saver:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    save_map_timeout:                5.0                                 # Seconds to wait for map save operations to complete. Common examples use 5.0 s.
    free_thresh_default:             0.25                                # Probability threshold below which a cell is saved as free. Common examples use 0.25.
    occupied_thresh_default:         0.65                                # Probability threshold above which a cell is saved as occupied. Common examples use 0.65.
    map_subscribe_transient_local:   true                                # Subscribe with transient-local durability so latched map data is received. Common examples use true.

planner_server:
  ros__parameters:
    # -- Planner runtime -------------------------------------------------------
    expected_planner_frequency:      0.5                                 # Expected planner run rate in Hz for diagnostics. Common examples use 20 Hz or 1 Hz depending on workload.
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    planner_plugins:                 ["GridBased"]                       # Planner plugins available to generate global paths. Common examples load one GridBased planner.

    # -- GridBased planner -----------------------------------------------------
    GridBased:
      plugin:                        "nav2_navfn_planner::NavfnPlanner"  # Planner implementation. Common example plugin is NavfnPlanner.
      tolerance:                     0.5                                 # Goal tolerance in meters if exact goal cell is not reachable. Common examples use 0.5 m.
      use_astar:                     false                               # Use Dijkstra when false or A* when true. Common Navfn example default is false.
      allow_unknown:                 true                                # Permit planning through unknown cells. Common mapped examples often use true.

smoother_server:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    smoother_plugins:                ["simple_smoother"]                 # Path smoother plugins available after planning. Common examples load one simple smoother.

    simple_smoother:
      plugin:                        "nav2_smoother::SimpleSmoother"     # Smoother implementation. Common example plugin is SimpleSmoother.
      tolerance:                     1.0e-10                             # Convergence tolerance for smoothing iterations. Common examples use 1.0e-10.
      max_its:                       1000                                # Maximum smoothing iterations. Common examples use 1000.
      do_refinement:                 true                                # Run a final refinement pass after smoothing. Common examples use true.

behavior_server:
  ros__parameters:
    # -- Costmap interfaces ----------------------------------------------------
    local_costmap_topic:             local_costmap/costmap_raw           # Local costmap topic used by recovery behaviors.
    global_costmap_topic:            global_costmap/costmap_raw          # Global costmap topic used by recovery behaviors.
    local_footprint_topic:           local_costmap/published_footprint   # Local footprint topic used by recovery behaviors.
    global_footprint_topic:          global_costmap/published_footprint  # Global footprint topic used by recovery behaviors.

    # -- Behavior plugins ------------------------------------------------------
    cycle_frequency:                 10.0                                # Behavior server update rate in Hz. Common examples use 10 Hz.
    behavior_plugins:                ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # Recovery/utility behaviors available to the behavior tree. This matches Nav2's standard example set.

    spin:
      plugin:                        "nav2_behaviors::Spin"              # Recovery behavior that rotates the robot in place. Standard Nav2 behavior plugin.

    backup:
      plugin:                        "nav2_behaviors::BackUp"            # Recovery behavior that drives backward. Standard Nav2 behavior plugin.

    drive_on_heading:
      plugin:                        "nav2_behaviors::DriveOnHeading"    # Behavior that drives along the current heading. Standard Nav2 behavior plugin.

    wait:
      plugin:                        "nav2_behaviors::Wait"              # Behavior that pauses for a duration. Standard Nav2 behavior plugin.

    assisted_teleop:
      plugin:                        "nav2_behaviors::AssistedTeleop"    # Behavior that allows guarded teleoperation. Standard Nav2 behavior plugin.

    # -- Frames and motion limits ---------------------------------------------
    global_frame:                    map                                 # Recovery behaviors should use the same SLAM-backed global frame as the planner and navigator.
    robot_base_frame:                base_footprint                      # Robot body frame used by recovery behaviors. Common default is base_link.
    transform_tolerance:             0.1                                 # TF lookup tolerance in seconds for behavior execution. Common examples use 0.1 s.
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    simulate_ahead_time:             2.0                                 # Seconds to project motion ahead for some recovery behaviors. Common examples use 2.0 s.
    max_rotational_vel:              0.3                                 # Maximum rotational speed in rad/s for behavior server motions. Common examples are often higher, around 1.0.
    min_rotational_vel:              0.1                                 # Minimum commanded rotational speed in rad/s for behavior server motions. Common examples use 0.4.
    rotational_acc_lim:              0.8                                 # Angular acceleration limit in rad/s^2 for behavior server motions. Common examples use 3.2.

waypoint_follower:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    loop_rate:                       5                                   # Waypoint follower loop rate in Hz. Common examples use 20 Hz.
    stop_on_failure:                 false                               # Continue to later waypoints after a failure when false. Common examples often use false.
    waypoint_task_executor_plugin:   "wait_at_waypoint"                  # Task executor plugin run at each waypoint. Common examples use wait_at_waypoint.

    wait_at_waypoint:
      plugin:                        "nav2_waypoint_follower::WaitAtWaypoint"  # Waypoint task executor that pauses at each waypoint. Standard Nav2 example plugin.
      enabled:                       true                                # Enable the waypoint task executor. Common examples use true.
      waypoint_pause_duration:       200                                 # Pause duration in milliseconds at each waypoint. Common examples often use 200 ms.

velocity_smoother:
  ros__parameters:
    use_sim_time:                    false                               # Use simulated clock if /clock is present. Default is typically false.
    smoothing_frequency:             10.0                                # Output smoothing rate in Hz. Was 15.0; common examples often use 20.0 Hz.
    scale_velocities:                false                               # Uniformly scale velocity components when one axis would violate limits. Common examples often use false.
    feedback:                        "CLOSED_LOOP"                       # When the smoother is enabled, use odometry feedback so commanded velocity tracks the real robot state more closely during map-frame missions.

    max_velocity:                    [0.26, 0.0, 0.3]                    # Maximum commanded [x, y, theta] velocities in [m/s, m/s, rad/s]. Theta was 0.25; common examples are often [0.5, 0.0, 2.5].
    min_velocity:                    [-0.26, 0.0, -0.3]                  # Minimum commanded [x, y, theta] velocities in [m/s, m/s, rad/s]. Theta was -0.25; common examples mirror max limits.
    max_accel:                       [1.0, 0.0, 0.8]                     # Maximum acceleration [x, y, theta] in [m/s^2, m/s^2, rad/s^2]. X was 2.5; common examples are often [2.5, 0.0, 3.2].
    max_decel:                       [-1.0, 0.0, -0.8]                   # Maximum deceleration [x, y, theta] in [m/s^2, m/s^2, rad/s^2]. X was -2.5; common examples mirror accel limits.

    odom_topic:                      "odom"                              # Odometry topic used if closed-loop feedback is enabled. Nav2 examples often use odom.
    odom_duration:                   0.1                                 # Seconds of odometry history considered by the smoother. Common examples use 0.1 s.
    deadband_velocity:               [0.0, 0.0, 0.0]                     # Small commanded velocities below these thresholds are snapped to zero. Common examples use all zeros.
    velocity_timeout:                1.0                                 # Seconds before output is forced to zero if no new command arrives. Common examples use 1.0 s.
