bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: localization/odometry_fused
    bt_loop_duration: 200
    default_server_timeout: 2000
    wait_for_service_timeout: 2000
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    current_progress_checker: progress_checker
    current_goal_checker: general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.1
      batch_size: 1600
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.2
      temperature: 0.2
      gamma: 0.005
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 3
      vx_max: 0.18
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.6
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.0
      vx_std: 0.14
      vy_std: 0.0
      wz_std: 0.45
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ObstaclesCritic.cost_power: 1
      ObstaclesCritic.repulsion_weight: 1.5
      ObstaclesCritic.critical_weight: 20.0
      ObstaclesCritic.collision_cost: 1000000.0
      ObstaclesCritic.consider_footprint: true
      GoalCritic.cost_weight: 5.0
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_weight: 12.0
      PathFollowCritic.cost_weight: 10.0
      PathAngleCritic.cost_weight: 2.0
      PathAngleCritic.mode: 0
      PreferForwardCritic.cost_weight: 2.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.55, 0.30], [0.55, -0.30], [-0.28, -0.30], [-0.28, 0.30]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      qos_overrides:
        /amr_sweeper/depth_camera/scan:
          subscription:
            reliability: best_effort
            history: keep_last
            depth: 5
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: depth_camera/scan
          data_type: LaserScan
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          clearing: true
          marking: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.2
          raytrace_max_range: 4.5
          raytrace_min_range: 0.2
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: odom
      rolling_window: true
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: '[[0.55, 0.30], [0.55, -0.30], [-0.28, -0.30], [-0.28, 0.30]]'
      width: 10
      height: 10
      resolution: 0.05
      track_unknown_space: false
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: mapping/global_costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.15
    - 0.0
    - 0.25
    min_velocity:
    - -0.15
    - 0.0
    - -0.3
    max_accel:
    - 1.0
    - 0.0
    - 0.8
    max_decel:
    - -1.0
    - 0.0
    - -0.8
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
