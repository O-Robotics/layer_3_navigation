/**:
  ros__parameters:
    # -- Motion reference -----------------------------------------------------
    motion_reference.imu_topic:                             imu/data_raw          # IMU topic used as the yaw reference for monocular VO.
    motion_reference.use_imu_yaw:                           true                  # Use IMU yaw to stabilize per-frame heading.
    motion_reference.use_wheel_scale:                       true                  # Use wheel odometry only for metric translation scale.
    motion_reference.lookup_tolerance_seconds:              0.20                  # Maximum timestamp mismatch allowed when pairing camera frames to the motion reference.
    motion_reference.history_seconds:                       5.0                   # Motion-reference history retained for timestamp alignment.
    motion_reference.imu_max_dt_seconds:                    0.10                  # Clamp IMU integration steps to avoid large jumps after delayed messages.
    motion_reference.imu_planar_accel_deadband_mps2:        0.15                  # Retained for IMU-history timing; not used for metric scale.
    motion_reference.imu_velocity_damping_per_second:       1.5                   # Retained for IMU-history timing; not used for metric scale.
    motion_reference.imu_stationary_angular_velocity_threshold_rad_s: 0.05       # Retained for IMU-history timing; not used for metric scale.
    wheel_odom_topic:                                       drive_controller/odom # Wheel odometry topic used for translation scale.

    # -- VO output ------------------------------------------------------------
    odom_topic:                                             visual_odometry/odom  # Single fused VO topic published for downstream localization.
    base_frame:                                             base_footprint
    odom_frame:                                             odom
    publish_tf:                                             false
    force_2d:                                               true
    tf_warning_tolerance_ms:                                50.0                    # Warn only when the latest TF is more than 50 ms older than the image timestamp.
    fusion_method:                                          ekf                   # Sequential Kalman-style fusion across all enabled camera delta estimates.
    min_cameras_per_estimate:                               1                     # Stereo is preferred, but allow a single healthy source rather than dropping all VO during brief camera sync misses.
    camera_fusion_tolerance_seconds:                        0.05                  # Group per-camera estimates that land close in time into one fused VO update.
    stereo_image_history_seconds:                            0.50                  # Retain a short image history for timestamp matching without putting much memory pressure on the Jetson.
    stereo_match_max_error:                                 25.0                  # LK error gate when matching left-to-right stereo correspondences.
    stereo_min_disparity_px:                                1.0                   # Ignore nearly-zero disparity matches because they triangulate poorly.
    stereo_max_reprojection_error_m:                        0.25                  # Reject stereo 3D correspondences that do not fit a rigid transform well.
    depth.sync_tolerance_seconds:                           0.25                  # Maximum timestamp mismatch when pairing tracking frames with sparse depth samples.
    depth.history_seconds:                                  0.50                  # Bounded depth-image history for sync without growing memory on the Jetson.
    depth.min_range_m:                                      0.20                  # Ignore RealSense near-field invalid/noisy depth.
    depth.max_range_m:                                      8.00                  # Keep VO on locally reliable depth features.
    depth.sampling_radius_px:                               1                     # Median sample a 3x3 patch around each tracked feature.
    depth.min_inliers:                                      8                     # Sparse metric-depth inlier floor; residual/jump gates reject weak fits.
    depth.min_valid_ratio:                                  0.35                  # Require enough tracked features to have valid depth before trusting the update.
    depth.max_residual_m:                                   0.20                  # Reject sparse 3D rigid fits with poor metric consistency.
    depth.max_translation_m:                                0.50                  # Per-frame jump gate at the configured VO frame rate.
    depth.max_yaw_rad:                                      0.35                  # Per-frame yaw jump gate.

    # -- Enabled cameras ------------------------------------------------------
    camera_names: [depth_camera_depth, depth_camera_infra1, depth_camera_infra2]
    stereo_pairs: [depth_camera_infra_stereo]

    cameras.depth_camera_depth.enabled:                     true
    cameras.depth_camera_depth.image_topic:                 depth_camera/depth/image_rect_raw
    cameras.depth_camera_depth.camera_info_topic:           depth_camera/depth/camera_info
    cameras.depth_camera_depth.camera_frame:                depth_camera_depth_optical_frame
    cameras.depth_camera_depth.use_depth:                   true
    cameras.depth_camera_depth.depth_image_topic:           depth_camera/depth/image_rect_raw
    cameras.depth_camera_depth.depth_camera_info_topic:     depth_camera/depth/camera_info
    cameras.depth_camera_depth.depth_camera_frame:          depth_camera_depth_optical_frame
    cameras.depth_camera_depth.fusion_weight:               1.3                   # Primary stand-alone metric VO source; sparse depth only, no dense pointcloud.

    cameras.tool_camera.enabled:                            false
    cameras.tool_camera.image_topic:                        usb_cameras/tools_camera/image_raw
    cameras.tool_camera.camera_info_topic:                  usb_cameras/tools_camera/tools_camera_info
    cameras.tool_camera.use_depth:                          false
    cameras.tool_camera.depth_image_topic:                  ""
    cameras.tool_camera.depth_camera_info_topic:            ""
    cameras.tool_camera.camera_frame:                       ""
    cameras.tool_camera.fusion_weight:                      0.5                   # Lower confidence than the depth camera because this stream is low-rate and low-resolution.

    cameras.depth_camera.enabled:                           false
    cameras.depth_camera.image_topic:                       depth_camera/color/image_raw
    cameras.depth_camera.camera_info_topic:                 depth_camera/color/camera_info
    cameras.depth_camera.use_depth:                         false
    cameras.depth_camera.depth_image_topic:                 ""
    cameras.depth_camera.depth_camera_info_topic:           ""
    cameras.depth_camera.camera_frame:                      depth_camera_color_optical_frame
    cameras.depth_camera.fusion_weight:                     1.0                   # Prefer the native depth-camera color stream when both cameras are available.

    cameras.depth_camera_infra1.enabled:                    true
    cameras.depth_camera_infra1.image_topic:                depth_camera/infra1/image_rect_raw
    cameras.depth_camera_infra1.camera_info_topic:          depth_camera/infra1/camera_info
    cameras.depth_camera_infra1.use_depth:                  true                  # Track textured IR features, then sample sparse depth for metric scale.
    cameras.depth_camera_infra1.depth_image_topic:          depth_camera/depth/image_rect_raw
    cameras.depth_camera_infra1.depth_camera_info_topic:    depth_camera/depth/camera_info
    cameras.depth_camera_infra1.depth_camera_frame:         depth_camera_depth_optical_frame
    cameras.depth_camera_infra1.camera_frame:               depth_camera_infra1_optical_frame
    cameras.depth_camera_infra1.fusion_weight:              1.1

    cameras.depth_camera_infra2.enabled:                    true
    cameras.depth_camera_infra2.image_topic:                depth_camera/infra2/image_rect_raw
    cameras.depth_camera_infra2.camera_info_topic:          depth_camera/infra2/camera_info
    cameras.depth_camera_infra2.use_depth:                  false
    cameras.depth_camera_infra2.depth_image_topic:          ""
    cameras.depth_camera_infra2.depth_camera_info_topic:    ""
    cameras.depth_camera_infra2.camera_frame:               depth_camera_infra2_optical_frame
    cameras.depth_camera_infra2.fusion_weight:              1.1

    cameras.front_left_camera.enabled:                      false
    cameras.front_left_camera.image_topic:                  usb_cameras/front_left_camera/image_raw
    cameras.front_left_camera.camera_info_topic:            usb_cameras/front_left_camera/front_left_camera_info
    cameras.front_left_camera.use_depth:                    false
    cameras.front_left_camera.depth_image_topic:            ""
    cameras.front_left_camera.depth_camera_info_topic:      ""
    cameras.front_left_camera.camera_frame:                 ""
    cameras.front_left_camera.fusion_weight:                0.5

    cameras.front_right_camera.enabled:                     false
    cameras.front_right_camera.image_topic:                 usb_cameras/front_right_camera/image_raw
    cameras.front_right_camera.camera_info_topic:           usb_cameras/front_right_camera/front_right_camera_info
    cameras.front_right_camera.use_depth:                   false
    cameras.front_right_camera.depth_image_topic:           ""
    cameras.front_right_camera.depth_camera_info_topic:     ""
    cameras.front_right_camera.camera_frame:                ""
    cameras.front_right_camera.fusion_weight:               0.5

    cameras.rear_left_camera.enabled:                       false
    cameras.rear_left_camera.image_topic:                   usb_cameras/rear_left_camera/image_raw
    cameras.rear_left_camera.camera_info_topic:             usb_cameras/rear_left_camera/rear_left_camera_info
    cameras.rear_left_camera.use_depth:                     false
    cameras.rear_left_camera.depth_image_topic:             ""
    cameras.rear_left_camera.depth_camera_info_topic:       ""
    cameras.rear_left_camera.camera_frame:                  ""
    cameras.rear_left_camera.fusion_weight:                 0.5

    cameras.rear_right_camera.enabled:                      false
    cameras.rear_right_camera.image_topic:                  usb_cameras/rear_right_camera/image_raw
    cameras.rear_right_camera.camera_info_topic:            usb_cameras/rear_right_camera/rear_right_camera_info
    cameras.rear_right_camera.use_depth:                    false
    cameras.rear_right_camera.depth_image_topic:            ""
    cameras.rear_right_camera.depth_camera_info_topic:      ""
    cameras.rear_right_camera.camera_frame:                 ""
    cameras.rear_right_camera.fusion_weight:                0.5

    stereo_pairs.depth_camera_infra_stereo.left_camera:            depth_camera_infra1
    stereo_pairs.depth_camera_infra_stereo.right_camera:           depth_camera_infra2
    stereo_pairs.depth_camera_infra_stereo.fusion_weight:          1.25
    stereo_pairs.depth_camera_infra_stereo.sync_tolerance_seconds: 0.08
    stereo_pairs.disabled_depth_camera_infra_stereo.left_camera:   ""
    stereo_pairs.disabled_depth_camera_infra_stereo.right_camera:  ""

    # -- Feature tracking -----------------------------------------------------
    max_features:                                            700
    min_tracked_features:                                    60
    min_inliers:                                             30
    feature_quality_level:                                   0.005
    feature_min_distance_px:                                 10.0
    corner_refinement_window_px:                             5
    optical_flow_window_px:                                  21
    optical_flow_max_pyramid_level:                          3
    optical_flow_max_error:                                  25.0

    # -- Motion estimation ----------------------------------------------------
    ransac_confidence:                                       0.999
    ransac_reprojection_threshold_px:                        2.0
    min_seconds_between_keyframes:                           0.08
    min_scale_translation_meters:                            0.015
    reject_zero_scale_updates:                               true                  # Do not feed FusionCore successful-looking VO updates when metric scale is unavailable or below the useful motion floor.

    # -- Output covariance shaping --------------------------------------------
    pose_sigma_floor_m:                                      0.03
    pose_sigma_ceiling_m:                                    0.50
    yaw_sigma_floor_rad:                                     0.02
    yaw_sigma_ceiling_rad:                                   0.35
