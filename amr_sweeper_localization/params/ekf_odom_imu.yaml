# EKF configuration for odometry + IMU debugging
# This configuration uses wheel odometry and IMU for sensor fusion testing

/**/ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometry input -  only linear x
    odom0: /amr_sweeper/diff_cont/odom
    odom0_config: [false,  false,  false,
               false, false, false,
               true, false, false,
               false, false, false,
               false, false, false]

    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # IMU input - configured for yaw and angular velocity fusion # change to angular Z only, without yaw
    imu0: /amr_sweeper/imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false

    use_control: false
    stamped_control: false
    control_timeout: 0.2
    control_config: [true, false, false, false, false, false]
    acceleration_limits: [1.3, 0.0, 0.0, 0.0, 0.0, 3.4]
