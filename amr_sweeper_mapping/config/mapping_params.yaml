/**/global_costmap:
  global_costmap:
    ros__parameters:
      # -- Mission geometry layer ---------------------------------------------
      geojson_layer:
        enabled:                  true
        plugin:                   amr_sweeper_mapping::Vda5050CostmapLayer
        costmap_yaml_path:        ""               # Resolved from mission_execution_directory/execution_context.json when available; leave empty for standalone launch and the layer will warn then stay inactive.
        artifact_frame_id:        odom

/**/amr_sweeper_slam_node:
  ros__parameters:
    # -- SLAM backend ---------------------------------------------------------
    slam_backend:                 slam_toolbox     # Backend identifier consumed by the wrapper node.
    map_frame:                    map              # Global mapping frame.
    odom_frame:                   odom             # Local odometry frame.
    base_frame:                   base_footprint   # Robot body frame used by SLAM.

    # -- Input topics ---------------------------------------------------------
    fusion_pose_topic:            localization/pose  # Fused localization pose topic inside the selected robot namespace.
    slam_pose_topic:              mapping/slam_toolbox/pose  # Remapped slam_toolbox pose topic relative to the node namespace.
    scan_topic:                   depth_camera/scan  # Depth-camera laserscan topic relative to the robot namespace.

    # -- Startup seeding ------------------------------------------------------
    seed_slam_from_fusion_pose:   false            # Online async mapping starts from odom-referenced motion; do not inject FusionCore odom poses as map-frame seeds.
    seed_period_seconds:          2.0              # Retry period for startup seeding.
    status_period_seconds:        2.0              # Periodic status publication cadence.
    max_seed_publications:        5                # Stop startup seeding after this many successful seed publications.

/**/gaussian_node:
  ros__parameters:
    # -- Output artifacts -----------------------------------------------------
    output_directory:              ""                               # Leave empty until a mission execution folder is injected; gaussian artifacts should stay inside per-run folders.
    source_mode:                   realsense_pointcloud             # Pointcloud ingestion mode used by the gaussian mapper.
    representation_name:           global_gaussian_map              # Default saved representation name when no mission-specific name is injected.
    world_frame:                   map                              # World frame used for saved gaussian data.

    # -- Input topics ---------------------------------------------------------
    pointcloud_topic:              depth_camera/depth/color/points  # Realsense pointcloud topic relative to the robot namespace.
    enable_surface_texture_camera: true                             # Fuse RGB texture from the tool camera into saved artifacts.
    surface_texture_topic:         usb_cameras/tools_camera/image_raw  # Tool-camera image topic relative to the robot namespace.

    # -- Downsampling and limits ----------------------------------------------
    voxel_size_meters:             0.10
    min_range_meters:              0.30
    max_range_meters:              8.00
    process_every_nth_point:       12
    max_voxels:                    150000
    max_debug_points:              25000

    # -- Persistence and status -----------------------------------------------
    save_ply:                      true
    save_json:                     true
    status_period_seconds:         2.0
    debug_publish_period_seconds:  3.0
    artifact_save_period_seconds:  10.0

/**/mapping_node:
  ros__parameters:
    # -- Mission inputs and outputs -------------------------------------------
    mission_file:                  ""                               # Resolved launch-time mission file path. Leave empty until a mission is selected.
    mission_route_file:            ""                               # Must come from the exact mission execution context; leave empty outside an active mission handoff.
    mission_id:                    ""
    mission_output_directory:      ""                               # Leave empty until a mission execution folder is injected; mapping_session.json should only land inside per-run folders.
    actual_path_output_file:       ""                               # Leave empty until execution_context.json provides the per-run actual-path destination.
    mission_costmap_yaml:          ""                               # Exact mission costmap yaml from execution_context.json when launched by layer 0.
    mission_window_start:          ""
    mission_window_end:            ""

    # -- Mapping runtime ------------------------------------------------------
    slam_backend:                  slam_toolbox
    gaussian_mode:                 voxel_gaussians
    frame_id:                      odom                             # Route and marker frame used for mission execution. Keep this in odom because FusionCore /fromLL returns local ENU coordinates in the odom frame.
    earth_frame:                   earth                            # REP-105 global earth frame (ECEF parent for a georeferenced map).
    map_frame:                     map                              # REP-105 global map frame produced by SLAM and consumed by Nav2 global planning.
    odom_frame:                    odom                             # REP-105 continuous local frame produced by FusionCore.
    fromll_service:                fromLL                           # Coordinate-conversion service used for geographic mission routes.
    datum_service:                 /get_datum                       # FusionCore service exposing the chosen GNSS datum used to anchor earth -> map.
    publish_earth_to_map:          true                             # Publish REP-105 earth -> map from the FusionCore datum and the live slam_toolbox map -> odom correction.
    earth_to_map_planar_only:      true                             # Keep earth -> map strictly 2D for Nav2 by dropping roll/pitch tilt from the geodetic anchor.
    earth_to_map_publish_period_seconds: 0.5                        # Keep the georeference updated as SLAM refines map -> odom.
    follow_waypoints_action:       follow_waypoints                 # Nav2 action name relative to the robot namespace.
    pad_live_map_to_minimum_size:  true                             # Republish the live slam_toolbox occupancy grid with a minimum square footprint so short default missions are plan-able immediately.
    min_global_map_size_m:         10.0                             # Minimum width/height of the republished live map in meters before Nav2 sees it.

    # -- Mission execution policy ---------------------------------------------
    auto_start_mission:            false
    repeat_mission:                false
    max_segments_per_goal:         4
    max_waypoint_spacing_m:        0.5                             # Densify long route segments so Nav2 plans to nearer intermediate targets while SLAM is still expanding the live map.
    status_period_seconds:         2.0
    mission_tick_period_seconds:   1.0
