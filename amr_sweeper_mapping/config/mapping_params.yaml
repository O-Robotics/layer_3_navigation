/**/global_costmap:
  global_costmap:
    ros__parameters:
      # -- Mission geometry layer ---------------------------------------------
      geojson_layer:
        enabled: true
        plugin: amr_sweeper_mapping::Vda5050CostmapLayer
        costmap_yaml_path: src/missions_log/global_costmap.yaml  # Runtime mission costmap artifact consumed by Nav2 when this block is reused there.

/**/amr_sweeper_slam_node:
  ros__parameters:
    # -- SLAM backend ---------------------------------------------------------
    slam_backend:                 slam_toolbox     # Backend identifier consumed by the wrapper node.
    map_frame:                    map              # Global mapping frame.
    odom_frame:                   odom             # Local odometry frame.
    base_frame:                   base_footprint   # Robot body frame used by SLAM.

    # -- Input topics ---------------------------------------------------------
    fusion_pose_topic:            pose             # Fused localization pose topic inside the selected robot namespace.
    slam_pose_topic:              pose             # SLAM output pose topic relative to the node namespace.
    scan_topic:                   depth_camera/scan  # Depth-camera laserscan topic relative to the robot namespace.

    # -- Startup seeding ------------------------------------------------------
    seed_slam_from_fusion_pose:   true             # Seed the SLAM backend from the fused pose estimate during startup.
    seed_period_seconds:          2.0              # Retry period for startup seeding.
    status_period_seconds:        2.0              # Periodic status publication cadence.
    max_seed_publications:        5                # Stop startup seeding after this many successful seed publications.

/**/amr_sweeper_gaussian_node:
  ros__parameters:
    # -- Output artifacts -----------------------------------------------------
    output_directory:              src/missions_log                  # Default artifact directory before launch-time mission overrides are injected.
    source_mode:                   realsense_pointcloud             # Pointcloud ingestion mode used by the gaussian mapper.
    representation_name:           global_gaussian_map              # Default saved representation name when no mission-specific name is injected.
    world_frame:                   map                              # World frame used for saved gaussian data.

    # -- Input topics ---------------------------------------------------------
    pointcloud_topic:              depth_camera/depth/color/points  # Realsense pointcloud topic relative to the robot namespace.
    enable_surface_texture_camera: true                             # Fuse RGB texture from the tool camera into saved artifacts.
    surface_texture_topic:         usb_cameras/tools_camera/image_raw  # Tool-camera image topic relative to the robot namespace.

    # -- Downsampling and limits ----------------------------------------------
    voxel_size_meters:             0.10
    min_range_meters:              0.30
    max_range_meters:              8.00
    process_every_nth_point:       12
    max_voxels:                    150000
    max_debug_points:              25000

    # -- Persistence and status -----------------------------------------------
    save_ply:                      true
    save_json:                     true
    status_period_seconds:         2.0
    debug_publish_period_seconds:  3.0
    artifact_save_period_seconds:  10.0

/**/amr_sweeper_mapping_node:
  ros__parameters:
    # -- Mission inputs and outputs -------------------------------------------
    mission_file:                  ""                               # Resolved launch-time mission file path. Leave empty until a mission is selected.
    mission_route_file:            src/missions_log/active_mission_path.geojson  # Default runtime route artifact before launch-time overrides.
    mission_id:                    ""
    mission_output_directory:      src/missions_log                 # Default artifact root before launch-time mission overrides are injected.
    actual_path_output_file:       src/missions_log/actual_path.geojson # Default actual-path artifact before launch-time overrides are injected.
    mission_window_start:          ""
    mission_window_end:            ""

    # -- Mapping runtime ------------------------------------------------------
    slam_backend:                  slam_toolbox
    gaussian_mode:                 voxel_gaussians
    frame_id:                      map
    fromll_service:                fromLL                           # Coordinate-conversion service relative to the robot namespace.
    follow_waypoints_action:       follow_waypoints                 # Nav2 action name relative to the robot namespace.

    # -- Mission execution policy ---------------------------------------------
    auto_start_mission:            true
    repeat_mission:                false
    max_segments_per_goal:         4
    status_period_seconds:         2.0
    mission_tick_period_seconds:   1.0
