/**:
  ros__parameters:
    # -- Frames and topics ----------------------------------------------------
    map_frame:                           map                              # Global metric planning frame used by the global costmap and Nav2; georeferenced mission data is locked into this Cartesian frame during startup.
    odom_frame:                          odom                             # Smooth local metric frame from FusionCore that anchors short-term motion and the local costmap.
    base_frame:                          base_footprint                   # Robot body frame that closes the map -> odom -> base_footprint TF chain and anchors scan matching.
    odometry_topic:                      localization/odometry_fused      # FusionCore pose in odom used as the local half of the map -> odom -> base_footprint chain.
    navsat_topic:                        gnss/navsat                      # Georeferenced GNSS fix used as an ongoing consistency input for the runtime map -> odom pose estimator.
    heading_topic:                       imu/data_heading                 # IMU heading used as an ongoing consistency input for the runtime map -> odom pose estimator.
    scan_topic:                          depth_camera/scan                # LaserScan used to match the robot against the already locked global costmap so map -> odom can absorb drift without shifting the costmap in map.
    global_costmap_topic:                mapping/global_costmap           # Runtime global costmap that acts as the known map for scan-to-map pose correction.
    fromll_service:                      /fromLL                          # Coordinate-conversion service that projects lon/lat fixes into the metric map frame.
    costmap_yaml_path:                   ""                               # Optional static reference costmap YAML, preferably the mission-folder artifact; its embedded georeference metadata is used only to score pose consistency, not to move the live runtime costmap itself.

    # -- Publish behavior -----------------------------------------------------
    publish_period_seconds:              0.5                              # Refresh period for the published map -> odom transform.
    publish_identity_when_pose_missing:  true                             # Keep map and odom co-located at startup until the runtime pose estimator has enough evidence to stretch map -> odom.

    # -- Scan matching --------------------------------------------------------
    occupied_threshold:                  65                               # Occupancy value that counts as a map hit when correlating scan endpoints against the global costmap.
    scan_subsample_step:                 4                                # Use every Nth beam during correlation to keep the bounded search light enough for startup and recovery.
    min_valid_scan_points:               20                               # Require at least this many usable scan endpoints before a scan match can correct map -> odom.
    endpoint_search_radius_cells:        1                                # Accept occupied cells within this neighborhood radius so minor raster offsets do not destabilize the score.
    search_translation_window_m:         2.0                              # Search this far around the current map-aligned odom pose in X and Y when refining the robot pose against the map.
    search_translation_step_m:           0.25                             # Translation step for the bounded map-correlation search.
    search_yaw_window_rad:               0.35                             # Search this far around the current map-aligned odom yaw, in radians.
    search_yaw_step_rad:                 0.0872664626                     # Yaw search step in radians, here roughly 5 degrees.
    translation_penalty_per_meter:       0.5                              # Penalize candidates that drift too far from the current map-aligned odom prediction.
    yaw_penalty_per_rad:                 0.25                             # Penalize candidates that drift too far from the current map-aligned odom yaw prediction.
    free_space_penalty:                  0.35                             # Penalize candidates whose beams pass through occupied cells before reaching the measured endpoint.
    free_space_reward:                   0.02                             # Small reward for beams that traverse cells already known to be free.
    occupied_reward:                     1.0                              # Reward given when a beam endpoint lands on an occupied structure in the global costmap.
    occupied_penalty:                    0.3                              # Penalty applied when a beam endpoint lands in a place that does not agree with the map.
    prior_blend_weight:                  0.7                              # Reserved compatibility knob from the earlier prior-based matcher; the runtime filter now starts identity and tracks scan corrections.
    scan_timeout_seconds:                1.0                              # Ignore stale scans so the matcher does not back-calculate map -> odom from old sensor data.
    costmap_timeout_seconds:             2.0                              # Ignore stale global costmaps during scan correlation.

    # -- Runtime correction filter -------------------------------------------
    max_translation_jump_m:              0.75                             # Clamp one update of map -> odom so a single bad correlation cannot teleport the robot in the map frame.
    max_yaw_jump_rad:                    0.35                             # Clamp one update of map -> odom in yaw so a single bad scan match cannot spin the robot pose.
    transform_smoothing_alpha:           0.35                             # Low-pass factor applied after filtering so the published transform behaves like a continuous localizer instead of a frame-to-frame jump detector.
    minimum_match_score:                 0.15                             # Matches below this score are treated as too weak to stretch map away from odom.
    high_confidence_match_score:         0.75                             # Matches at or above this score are treated as strong corrections in the map -> odom filter.
    minimum_confidence_for_filter_update: 0.45                            # Required confidence before the scan match is allowed to update the runtime map -> odom filter.
    low_confidence_identity_pull_alpha:  0.15                             # When confidence is low, pull the runtime filter back toward identity so map and odom re-align.

    # -- Georeference consistency --------------------------------------------
    georef_consistency_max_error_m:      5.0                              # Maximum acceptable difference in meters between the candidate map-matched pose and the GNSS/heading georeference prior before confidence collapses.
    georef_consistency_min_confidence:   0.2                              # Lower bound applied to the GNSS-and-heading consistency multiplier so it influences the runtime pose estimate without fully overriding scan matching.

    # -- EKF tuning -----------------------------------------------------------
    process_noise_diagonal:              [0.01, 0.01, 0.005]             # Random-walk process noise for the runtime map -> odom EKF state [x, y, yaw].
    measurement_noise_diagonal_min:      [0.05, 0.05, 0.02]              # Best-case scan-match measurement noise for the runtime map -> odom EKF state [x, y, yaw].
    measurement_noise_diagonal_max:      [0.6, 0.6, 0.3]                 # Worst-case scan-match measurement noise for the runtime map -> odom EKF state [x, y, yaw].
