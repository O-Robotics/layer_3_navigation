/**/gaussian_node:
  ros__parameters:
    # -- Output artifacts -----------------------------------------------------
    output_directory:              ""                               # Leave empty until a mission execution folder is injected; gaussian artifacts should stay inside per-run folders.
    source_mode:                   realsense_pointcloud             # Pointcloud ingestion mode used by the gaussian mapper.
    representation_name:           global_gaussian_map              # Default saved representation name when no mission-specific name is injected.
    world_frame:                   map                              # World frame used for saved gaussian data.

    # -- Input topics ---------------------------------------------------------
    pointcloud_topic:              depth_camera/depth/color/points  # Realsense pointcloud topic relative to the robot namespace.
    enable_surface_texture_camera: true                             # Fuse RGB texture from the tool camera into saved artifacts.
    surface_texture_topic:         usb_cameras/tools_camera/image_raw  # Tool-camera image topic relative to the robot namespace.

    # -- Downsampling and limits ----------------------------------------------
    voxel_size_meters:             0.10
    min_range_meters:              0.30
    max_range_meters:              8.00
    process_every_nth_point:       12
    max_voxels:                    150000
    max_debug_points:              25000

    # -- Persistence and status -----------------------------------------------
    save_ply:                      true
    save_json:                     true
    status_period_seconds:         2.0
    debug_publish_period_seconds:  3.0
    artifact_save_period_seconds:  10.0

/**/mapping_node:
  ros__parameters:
    # -- Mission inputs and outputs -------------------------------------------
    mission_file:                  ""                               # Resolved launch-time mission file path. Leave empty until a mission is selected.
    mission_route_file:            ""                               # Must come from the exact mission execution context; leave empty outside an active mission handoff.
    mission_id:                    ""
    mission_output_directory:      ""                               # Leave empty until a mission execution folder is injected; stamped mapping metadata should only land inside per-run folders.
    actual_path_output_file:       ""                               # Leave empty until the stamped execution context provides the per-run actual-path destination.
    mission_costmap_yaml:          ""                               # Exact mission costmap yaml from the stamped execution context when launched by layer 0.
    saved_costmap_yaml:            ""                               # Optional georeferenced saved costmap YAML/PGM artifact to lock once into the metric map frame at startup before live scan updates continue.
    mission_window_start:          ""
    mission_window_end:            ""

    # -- Mapping runtime ------------------------------------------------------
    slam_backend:                  map_builder
    gaussian_mode:                 voxel_gaussians
    frame_id:                      odom                             # Route and marker frame used for mission execution. Keep this in odom because FusionCore /fromLL returns local ENU coordinates in the odom frame.
    map_frame:                     map                              # REP-105 global metric frame consumed by Nav2 global planning; the saved georeferenced costmap is projected into this Cartesian frame during startup lock-in.
    odom_frame:                    odom                             # REP-105 continuous local frame produced by FusionCore.
    base_frame:                    base_footprint                   # Robot body frame used by the in-package scan map builder readiness checks.
    scan_topic:                    depth_camera/scan                # Depth-camera laserscan topic relative to the robot namespace.
    heading_topic:                 imu/data_heading                 # IMU heading used only for the startup georeferenced costmap lock-in; runtime map -> odom corrections are handled by map_pose_node.
    map_pose_status_topic:         mapping/map_pose_status          # map_pose_node health topic. BOOTSTRAP, DEGRADED, HEALTHY, and WARNING all allow scan integration; FAULT blocks it.
    startup_tf_lookup_timeout_seconds: 0.05                        # Wait this long per scan while the local tf listener warms up and ingests the full map -> sensor chain before startup scan integration begins.
    startup_tf_ready_streak_required: 3                            # Require this many consecutive successful map -> scan transform checks before the first scan is allowed into the runtime map builder.
    georef_lock_window_seconds:    3.0                              # Wait this long while collecting GNSS and IMU heading samples before locking the saved georeferenced costmap into the metric map frame.
    georef_lock_min_samples:       10                               # Minimum samples required inside the stabilization window before the one-time startup costmap lock is accepted.
    fromll_service:                /fromLL                          # Coordinate-conversion service used for geographic mission routes.
    global_map_resolution_m:       0.05                             # Resolution of the in-package global occupancy-grid map builder.
    runtime_costmap_save_period_seconds: 10.0                       # Periodically write the runtime mission costmap artifact back into the active run folder while scans refine it.
    static_obstacle_min_observations: 6                             # Minimum number of occupied observations before a scanned obstacle is considered static enough to persist into the runtime costmap artifact.
    static_obstacle_min_occupied_fraction: 0.75                     # Minimum occupied-observation fraction required before a cell is treated as static structure instead of a transient obstacle.
    bootstrap_empty_global_costmap: false                           # When true, publish an in-memory unknown occupancy grid around the current odometry pose so dummy runs can bootstrap Nav2 without any saved costmap artifact on disk.
    navigate_through_poses_action: navigate_through_poses           # Nav2 action name relative to the robot namespace.
    pad_live_map_to_minimum_size:  true                             # Republish the live global occupancy grid with a minimum square footprint so short default missions are plan-able immediately.
    min_global_map_size_m:         10.0                             # Minimum width/height of the republished live map in meters before Nav2 sees it.

    # -- Mission execution policy ---------------------------------------------
    auto_start_mission:            false
    repeat_mission:                false
    max_segments_per_goal:         4
    max_waypoint_spacing_m:        0.5                             # Densify long route segments so Nav2 plans to nearer intermediate targets while SLAM is still expanding the live map.
    advance_past_blocked_waypoints: true                           # When Nav2 cannot reach a chunk target, skip that blocked waypoint and continue toward the next route waypoint.
    max_blocked_waypoint_advances: 20                              # Abort after this many consecutive blocked-waypoint skips to avoid endless coverage loss.
    status_period_seconds:         2.0
    mission_tick_period_seconds:   1.0
