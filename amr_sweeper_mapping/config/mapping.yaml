/**/gaussian_splat_capture_node:
  ros__parameters:
    # -- Output artifacts -----------------------------------------------------
    output_directory:              ""                               # Leave empty until a mission execution folder is injected; gaussian artifacts should stay inside per-run folders.
    source_mode:                   synchronized_camera_dataset      # Mission capture mode used by offline gaussian-splat tooling.
    representation_name:           global_gaussian_map              # Default saved representation name when no mission-specific name is injected.
    world_frame:                   map                              # World frame used for saved gaussian data.

    # -- Input topics ---------------------------------------------------------
    odom_topic:                    localization/odometry_fused
    map_pose_status_topic:         mapping/map_pose_status
    camera_names:
      - depth_color
      - front_left_camera
      - front_right_camera
      - rear_left_camera
      - rear_right_camera
      - tools_camera
    camera_image_topics:
      - depth_camera/color/image_raw
      - usb_cameras/front_left_camera/image_raw
      - usb_cameras/front_right_camera/image_raw
      - usb_cameras/rear_left_camera/image_raw
      - usb_cameras/rear_right_camera/image_raw
      - usb_cameras/tools_camera/image_raw
    camera_info_topics:
      - depth_camera/color/camera_info
      - usb_cameras/front_left_camera/front_left_camera_info
      - usb_cameras/front_right_camera/front_right_camera_info
      - usb_cameras/rear_left_camera/rear_left_camera_info
      - usb_cameras/rear_right_camera/rear_right_camera_info
      - usb_cameras/tools_camera/tools_camera_info
    enable_pointcloud_capture:     true
    pointcloud_topic:              depth_camera/depth/color/points  # Realsense pointcloud topic relative to the robot namespace.

    # -- Downsampling and limits ----------------------------------------------
    capture_distance_meters:       0.50
    capture_yaw_degrees:           15.0
    min_capture_period_seconds:    1.0
    max_camera_timestamp_skew_seconds: 0.20
    max_camera_sample_age_seconds: 1.00
    max_pointcloud_sample_age_seconds: 0.50
    min_camera_count:              1
    enable_voxel_preview:          false
    voxel_size_meters:             0.10
    min_range_meters:              0.30
    max_range_meters:              8.00
    process_every_nth_point:       12
    max_voxels:                    150000
    max_debug_points:              25000

    # -- Persistence and status -----------------------------------------------
    save_ply:                      true
    save_json:                     true
    status_period_seconds:         2.0
    debug_publish_period_seconds:  3.0
    artifact_save_period_seconds:  10.0

/**/mapping_node:
  ros__parameters:
    # -- Mission inputs and outputs -------------------------------------------
    mission_file:                  ""                               # Resolved launch-time mission file path. Leave empty until a mission is selected.
    mission_route_file:            ""                               # Must come from the exact mission execution context; leave empty outside an active mission handoff.
    mission_id:                    ""
    mission_output_directory:      ""                               # Leave empty until a mission execution folder is injected; stamped mapping metadata should only land inside per-run folders.
    actual_path_output_file:       ""                               # Leave empty until the stamped execution context provides the per-run actual-path destination.
    mission_static_costmap_yaml:          ""                               # Exact mission static costmap yaml from the stamped execution context when launched by layer 0.
    saved_costmap_yaml:            ""                               # Runtime run-folder static costmap artifact. Georeferenced sources are projected at runtime but saved back in the source artifact frame.
    persistent_mission_static_costmap_yaml: ""                             # Persistent mission-folder <mission_id>_static_costmap YAML that receives post-run corrections without shifting its origin.
    mission_window_start:          ""
    mission_window_end:            ""

    # -- Mapping runtime ------------------------------------------------------
    slam_backend:                  map_builder
    gaussian_mode:                 voxel_gaussians
    frame_id:                      odom                             # Route and marker frame used for mission execution. Keep this in odom because FusionCore /fromLL returns local ENU coordinates in the odom frame.
    map_frame:                     map                              # REP-105 global metric frame consumed by Nav2 global planning; mapping_node publishes the runtime-projected static costmap in this frame.
    odom_frame:                    odom                             # REP-105 continuous local frame produced by FusionCore.
    base_frame:                    base_footprint                   # Robot body frame used by the in-package scan map builder readiness checks.
    scan_topic:                    depth_camera/scan                # Depth-camera laserscan topic relative to the robot namespace.
    heading_topic:                 imu/data_heading                 # IMU heading used only for the startup georeferenced costmap lock-in; runtime map -> odom corrections are handled by map_pose_node.
    map_pose_status_topic:         mapping/map_pose_status          # map_pose_node health topic. BOOTSTRAP, DEGRADED, HEALTHY, and WARNING all allow scan integration; FAULT blocks it.
    startup_tf_lookup_timeout_seconds: 0.05                        # Wait this long per scan while the local tf listener warms up and ingests the full map -> sensor chain before startup scan integration begins.
    startup_tf_ready_streak_required: 3                            # Require this many consecutive successful map -> scan transform checks before the first scan is allowed into the runtime map builder.
    navigation_tf_ready_streak_required: 3                         # Require this many consecutive map -> base_footprint checks before sending a Nav2 mission chunk so transient localization gaps do not consume blocked-waypoint recovery.
    max_no_progress_nav2_retries: 60                               # Retry a Nav2 chunk this many times when it fails before reporting waypoint progress; these failures are treated as readiness/localization issues, not blocked route waypoints.
    active_goal_min_odometry_progress_m: 0.5                       # Treat an active Nav2 goal as having made route progress once odometry has moved this far from the chunk dispatch pose, which keeps single-waypoint chunks from masking real controller motion.
    active_goal_divergence_timeout_seconds: 120.0                  # Cancel an active Nav2 chunk if the robot has moved but has not meaningfully closed on its target for this long, allowing blocked-waypoint recovery instead of an endless chase.
    active_goal_required_closing_progress_m: 0.5                   # Minimum distance-to-target improvement that refreshes the active-goal divergence watchdog timer.
    active_goal_allowed_distance_regression_m: 3.0                 # Require this much regression from the best observed distance before the divergence watchdog cancels the active Nav2 goal.
    georef_lock_window_seconds:    3.0                              # Startup seeding window used to collect GNSS and IMU heading samples before the saved georeferenced costmap is projected into the metric map frame.
    georef_lock_fallback_timeout_seconds: 6.0                       # Hold scan integration (no from-scratch map) until the georeferenced seed locks or this much time has passed since it started loading, whichever comes first. Clamped to be >= georef_lock_window_seconds.
    georef_lock_min_samples:       10                               # Minimum samples required inside the seeding window before the one-time startup costmap projection is accepted.
    georef_lock_max_navsat_spread_m: 2.0                            # Reject the startup seed if the GNSS samples inside the window spread farther than this from their centroid. Set <= 0 to disable the check.
    georef_lock_max_heading_deviation_deg: 12.0                     # Reject the startup seed if the heading samples inside the window deviate farther than this from their circular mean. Set <= 0 to disable the check.
    fromll_service:                /fromLL                          # Coordinate-conversion service used for geographic mission routes.
    global_map_resolution_m:       0.05                             # Resolution of the in-package global occupancy-grid map builder.
    runtime_costmap_save_period_seconds: 10.0                       # Periodically write the runtime mission static costmap artifact back into the active run folder while scans refine it.
    static_costmap_save_max_map_to_odom_translation_m: 5.0          # Refuse runtime and persistent static-costmap saves when map -> odom translation exceeds this. Set <= 0 to disable the translation gate.
    static_costmap_save_max_map_to_odom_yaw_deg: 30.0               # Refuse runtime and persistent static-costmap saves when map -> odom yaw exceeds this. Set <= 0 to disable the yaw gate.
    static_obstacle_min_observations: 6                             # Minimum number of consistent scan observations before a seeded or live cell is allowed to change the saved runtime costmap artifact.
    static_obstacle_min_occupied_fraction: 0.75                     # Minimum occupied-observation fraction required before a cell is treated as static structure instead of a transient obstacle.
    static_obstacle_min_free_fraction: 0.75                         # Minimum free-observation fraction required before repeated scans carve a seeded or transient obstacle back to free space in the saved runtime costmap artifact.
    bootstrap_empty_global_costmap: false                           # When true, publish an in-memory unknown occupancy grid around the current odometry pose so dummy runs can bootstrap Nav2 without any saved costmap artifact on disk.
    navigate_through_poses_action: navigate_through_poses           # Nav2 action name relative to the robot namespace.
    pad_live_map_to_minimum_size:  true                             # Republish the live global occupancy grid with a minimum square footprint so short default missions are plan-able immediately.
    min_global_map_size_m:         10.0                             # Minimum width/height of the republished live map in meters before Nav2 sees it.

    # -- Mission execution policy ---------------------------------------------
    auto_start_mission:            false
    repeat_mission:                false
    max_segments_per_goal:         24                               # Send a rolling mission horizon to Nav2 so it replans ahead of the robot instead of stopping at every short route segment; feedback still lets blocked-waypoint recovery identify the failed pose inside the active horizon.
    max_waypoint_spacing_m:        2.0                              # Densify long route segments so Nav2 plans to nearer intermediate targets while SLAM is still expanding the live map.
    max_mission_route_points:      5000                             # Reject route conversion if densification would exceed this, which catches frame/unit mismatches before Nav2 sees invalid goals.
    advance_past_blocked_waypoints: true                           # When Nav2 cannot reach a chunk target, skip that blocked waypoint and continue toward the next route waypoint.
    max_blocked_waypoint_advances: 20                              # Abort after this many consecutive blocked-waypoint skips to avoid endless coverage loss.
    mission_start_mode:           start_over                       # Fresh missions navigate to the authored first waypoint. Use resume_last only when continuing a halted mission from saved progress/actual robot pose.
    reorder_route_start_to_nearest_pose: false                     # Deprecated compatibility flag. When true, behaves like mission_start_mode=resume_last and trims already-covered earlier waypoints instead of wrapping them to the end.
    route_start_reorder_min_improvement_m: 1.0                     # Keep the authored first waypoint when the nearest waypoint is not at least this much closer to the robot.
    route_start_entry_min_distance_m: 2.0                          # In resume_last mode, if the nearest waypoint is under this distance from the robot, enter at the next forward route waypoint far enough away for Nav2/controller tracking.
    blocked_recovery_reentry_min_improvement_m: 2.0                # After a failed goal moved the robot, resume from the remaining route waypoint nearest the actual robot pose when it is meaningfully closer than the authored next waypoint.
    status_period_seconds:         2.0
    mission_tick_period_seconds:   1.0
