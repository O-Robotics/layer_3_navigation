/**:
  ros__parameters:
    base_frame: base_footprint
    odom_frame: odom
    publish_rate: 50.0
    publish.force_2d: true
    publish.tf: true

    # -- IMU -------------------------------------------------------------------
    imu.has_magnetometer: false
    imu.gyro_noise: 0.005
    imu.accel_noise: 0.1
    imu.remove_gravitational_acceleration: false
    imu.frame_id: imu_link

    # -- Primary wheel odometry ------------------------------------------------
    encoder.vel_noise: 0.05
    encoder.yaw_noise: 0.02

    # -- Secondary visual odometry ---------------------------------------------
    encoder2.topic: "visual_odometry/odom"
    encoder2.vel_noise: 0.03
    encoder2.yaw_noise: 0.01

    # -- GNSS / heading --------------------------------------------------------
    gnss.base_noise_xy: 1.5
    gnss.base_noise_z: 3.0
    gnss.heading_noise: 0.02
    gnss.max_hdop: 4.0
    gnss.min_satellites: 4
    gnss.min_fix_type: 1
    gnss.fix2_topic: ""
    gnss.heading_topic: "imu/data_heading"
    gnss.azimuth_topic: ""
    gnss.lever_arm_x: 0.0
    gnss.lever_arm_y: 0.0
    gnss.lever_arm_z: 0.0

    # -- Outlier rejection -----------------------------------------------------
    outlier_rejection: true
    outlier_threshold_gnss: 16.27
    outlier_threshold_imu: 1000000.00
    outlier_threshold_enc: 11.34
    outlier_threshold_hdg: 10.83

    # -- Adaptive noise --------------------------------------------------------
    adaptive.imu: true
    adaptive.encoder: true
    adaptive.gnss: true
    adaptive.window: 50
    adaptive.alpha: 0.01

    init.stationary_window: 2.0

    # -- Zero-velocity updates -------------------------------------------------
    zupt.enabled: true
    zupt.velocity_threshold: 0.05
    zupt.angular_threshold: 0.05
    zupt.noise_sigma: 0.01

    # -- UKF process noise -----------------------------------------------------
    ukf.q_position: 0.01
    ukf.q_orientation: 1.0e-9
    ukf.q_velocity: 0.1
    ukf.q_angular_vel: 0.1
    ukf.q_acceleration: 1.0
    ukf.q_gyro_bias: 1.0e-5
    ukf.q_accel_bias: 1.0e-5

    # -- Coordinate systems ----------------------------------------------------
    input.gnss_crs: "EPSG:4326"
    output.crs: "EPSG:4978"
    output.convert_to_enu_at_reference: true
    reference.use_first_fix: true
    reference.x: 0.0
    reference.y: 0.0
    reference.z: 0.0
