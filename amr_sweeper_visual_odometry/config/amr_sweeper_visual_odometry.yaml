/**:
  ros__parameters:
    # -- Motion reference -----------------------------------------------------
    motion_reference.mode: imu                 # Use IMU-integrated short-horizon motion as the default scale and yaw reference.
    motion_reference.imu_topic: imu/data_raw  # IMU topic that provides orientation plus linear acceleration for short-horizon scale estimation.
    motion_reference.use_yaw: true            # Override visual yaw with motion-reference yaw when available.
    motion_reference.lookup_tolerance_seconds: 0.20  # Maximum timestamp mismatch allowed when pairing camera frames to the motion reference.
    motion_reference.history_seconds: 5.0     # Motion-reference history retained for timestamp alignment.
    motion_reference.imu_max_dt_seconds: 0.10  # Clamp IMU integration steps to avoid large jumps after delayed messages.
    motion_reference.imu_planar_accel_deadband_mps2: 0.15  # Treat smaller planar accelerations as zero to reduce drift.
    motion_reference.imu_velocity_damping_per_second: 1.5  # Exponential damping applied to the integrated planar IMU velocity.
    motion_reference.imu_stationary_angular_velocity_threshold_rad_s: 0.05  # Zero the IMU-integrated velocity when the robot is effectively stationary.
    wheel_odom_topic: diff_cont/odom          # Optional fallback motion reference topic when motion_reference.mode is set to wheel.

    # -- VO output ------------------------------------------------------------
    odom_topic: visual_odometry/odom          # Single fused VO topic published for downstream localization.
    base_frame: base_footprint
    odom_frame: odom
    publish_tf: false
    force_2d: true
    fusion_method: ekf                        # Sequential Kalman-style fusion across all enabled camera delta estimates.
    min_cameras_per_estimate: 1               # Allow single-camera operation while still supporting multi-camera fusion.
    camera_fusion_tolerance_seconds: 0.05     # Group per-camera estimates that land close in time into one fused VO update.

    # -- Enabled cameras ------------------------------------------------------
    camera_names: [tool_camera, depth_camera, front_left_camera, front_right_camera, rear_left_camera, rear_right_camera]

    cameras.tool_camera.enabled: true
    cameras.tool_camera.image_topic: usb_cameras/tools_camera/image_raw
    cameras.tool_camera.camera_info_topic: usb_cameras/tools_camera/tools_camera_info
    cameras.tool_camera.camera_frame: ""

    cameras.depth_camera.enabled: true
    cameras.depth_camera.image_topic: depth_camera/color/image_raw
    cameras.depth_camera.camera_info_topic: depth_camera/color/camera_info
    cameras.depth_camera.camera_frame: depth_camera_color_optical_frame

    cameras.front_left_camera.enabled: false
    cameras.front_left_camera.image_topic: usb_cameras/front_left_camera/image_raw
    cameras.front_left_camera.camera_info_topic: usb_cameras/front_left_camera/front_left_camera_info
    cameras.front_left_camera.camera_frame: ""

    cameras.front_right_camera.enabled: false
    cameras.front_right_camera.image_topic: usb_cameras/front_right_camera/image_raw
    cameras.front_right_camera.camera_info_topic: usb_cameras/front_right_camera/front_right_camera_info
    cameras.front_right_camera.camera_frame: ""

    cameras.rear_left_camera.enabled: false
    cameras.rear_left_camera.image_topic: usb_cameras/rear_left_camera/image_raw
    cameras.rear_left_camera.camera_info_topic: usb_cameras/rear_left_camera/rear_left_camera_info
    cameras.rear_left_camera.camera_frame: ""

    cameras.rear_right_camera.enabled: false
    cameras.rear_right_camera.image_topic: usb_cameras/rear_right_camera/image_raw
    cameras.rear_right_camera.camera_info_topic: usb_cameras/rear_right_camera/rear_right_camera_info
    cameras.rear_right_camera.camera_frame: ""

    # -- Feature tracking -----------------------------------------------------
    max_features: 500
    min_tracked_features: 90
    min_inliers: 40
    feature_quality_level: 0.01
    feature_min_distance_px: 10.0
    corner_refinement_window_px: 5
    optical_flow_window_px: 21
    optical_flow_max_pyramid_level: 3
    optical_flow_max_error: 20.0

    # -- Motion estimation ----------------------------------------------------
    ransac_confidence: 0.999
    ransac_reprojection_threshold_px: 1.5
    min_seconds_between_keyframes: 0.05
    min_scale_translation_meters: 0.005

    # -- Output covariance shaping --------------------------------------------
    pose_sigma_floor_m: 0.03
    pose_sigma_ceiling_m: 0.50
    yaw_sigma_floor_rad: 0.02
    yaw_sigma_ceiling_rad: 0.35
